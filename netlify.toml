# Redirects for URLs from the old Squarespace site, so inbound links keep working.
[[redirects]]
  from = "/artist-cv"
  to = "/cv.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/"
  status = 301

[[redirects]]
  from = "/artwork-:n"
  to = "/"
  status = 301

[[redirects]]
  from = "/store/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
